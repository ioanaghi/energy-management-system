spring.application.name=auth-service
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credential_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt-secret=${JWT_SECRET}
app.internal-key=${INTERNAL_KEY}
app.user-service-url=${USER_SERVICE_URL:http://user-service:8081}
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD}
app.bootstrap-admin=${BOOTSTRAP_ADMIN:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/auth-service/api-docs/swagger-config
springdoc.swagger-ui.url=/auth-service/api-docs
server.error.include-message=always
