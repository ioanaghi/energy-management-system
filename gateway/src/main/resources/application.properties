spring.application.name=gateway
server.port=8081
app.jwt-secret=${JWT_SECRET}
app.internal-key=${INTERNAL_KEY}
app.user-service-url=${USER_SERVICE_URL:http://user-service:8081}
app.device-service-url=${DEVICE_SERVICE_URL:http://device-service:8081}
app.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8081}
server.error.include-message=always
