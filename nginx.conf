events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream gateway_backend {
        zone gateway_backend 64k;
        server gateway:8081 resolve;
    }
    upstream user_backend {
        zone user_backend 64k;
        server user-service:8081 resolve;
    }
    upstream device_backend {
        zone device_backend 64k;
        server device-service:8081 resolve;
    }
    upstream auth_backend {
        zone auth_backend 64k;
        server auth-service:8081 resolve;
    }
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 64k;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_backend;
        }

        location /api/ {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /user-service/ {
            proxy_pass http://user_backend/;
        }

        location /device-service/ {
            proxy_pass http://device_backend/;
        }

        location /auth-service/ {
            proxy_pass http://auth_backend/;
        }

        location ~ ^/(user-service|device-service)/api/ {
            return 403;
        }

        location ~ ^/auth-service/(api|internal)/ {
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
